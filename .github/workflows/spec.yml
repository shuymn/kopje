name: Specification
# Checks Kopje's TLA+ specifications (packages/kopje/spec/) under the official TLC, the second checker beside tla-ts,
# which CI's kopje-spec project runs (test-node/collection-consent-spec.test.ts). Both must give the outcomes
# spec/collection-consent/checks.json records. It runs when a specification, its checks, the scripts that run them, the
# pinned tools (the JDK in mise.spec.toml, node in mise.toml) or the tla-ts pin change.
on:
  pull_request:
    paths:
      - "packages/kopje/spec/**"
      - "packages/kopje/scripts/collection-consent-plan.mjs"
      - "packages/kopje/scripts/tlc-check.mjs"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "mise.toml"
      - "mise.lock"
      - "mise.spec.toml"
      - "mise.spec.lock"
      - ".github/workflows/spec.yml"
  push:
    branches:
      - main
    paths:
      - "packages/kopje/spec/**"
      - "packages/kopje/scripts/collection-consent-plan.mjs"
      - "packages/kopje/scripts/tlc-check.mjs"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "mise.toml"
      - "mise.lock"
      - "mise.spec.toml"
      - "mise.spec.lock"
      - ".github/workflows/spec.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  tlc:
    # The checks take about 2 min on a laptop, one TLC process at a time.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # mise.spec.toml's JDK, on top of mise.toml.
    env:
      MISE_ENV: spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node and the JDK at the versions mise.lock and mise.spec.lock pin. The script needs no package: it downloads
      # TLC's jar and checks its SHA-256.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node java

      - name: Check the specifications under TLC
        working-directory: packages/kopje
        run: node scripts/tlc-check.mjs
