name: Security checks
# Scans the whole history for secrets with betterleaks and the repository's .betterleaks.toml; the pre-commit hook
# scans only the staged change (lefthook.yml).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  security:
    permissions:
      contents: read
    uses: shuymn/github-actions/.github/workflows/security.yml@a43aebd0e0cb9753377b044675cbbd099e368576 # main
