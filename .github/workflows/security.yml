name: Security checks
# Scans the whole history for secrets with betterleaks and the repository's .betterleaks.toml; the pre-commit hook
# scans only the staged change (lefthook.yml).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  security:
    permissions:
      contents: read
    uses: shuymn/github-actions/.github/workflows/security.yml@0ab53ef2ee457ec00b2ac7699423a7b513f8a2dd # main
