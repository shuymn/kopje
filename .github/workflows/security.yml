name: Security checks
# Scans the whole history for secrets with betterleaks and the repository's .betterleaks.toml; the pre-commit hook
# scans only the staged change (lefthook.yml).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  security:
    permissions:
      contents: read
    uses: shuymn/github-actions/.github/workflows/security.yml@c37ba43d005c3f19dccdc962c04da5fb06c28af5 # main
