name: Update mise tools

# Re-resolve the major-version ranges in mise.toml and propose the new
# mise.lock. Renovate cannot update these ranges: it reads a range such as "1"
# as version 1.0.0 and drops the update as a downgrade. `mise lock --bump` only
# reads release metadata and writes the lockfile; it never installs or runs the
# tools, so the App token is created in the same job after it. Only tools whose
# version changes are re-locked, so checksums of unchanged versions stay pinned.

on:
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BRANCH: mise-update
      LOCK: mise.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: false
          cache: false

      - name: Update lockfile
        id: lock
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_YES: 1
        run: |
          set -eu
          mise trust mise.toml >/dev/null
          mise lock --bump --dry-run --json >"$RUNNER_TEMP/changes.json"
          if [ "$(jq length "$RUNNER_TEMP/changes.json")" -eq 0 ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.[].name' "$RUNNER_TEMP/changes.json" | while IFS= read -r tool; do
            mise lock --bump "$tool" </dev/null
          done
          status=$(git status --porcelain --untracked-files=all)
          if [ "$status" != " M $LOCK" ]; then
            printf 'mise lock changed unexpected files:\n%s\n' "$status" >&2
            exit 1
          fi
          {
            echo "| Tool | From | To |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| `\(.name)` | \(.old_versions | join(", ")) | \(.new_versions | join(", ")) |"' "$RUNNER_TEMP/changes.json"
          } >"$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >>"$GITHUB_STEP_SUMMARY"
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Create App token
        if: steps.lock.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          COMMIT_QUERY: >-
            mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) { commit { oid } }
            }
        run: |
          set -eu
          repo=$GITHUB_REPOSITORY
          # A branch with the same lockfile is already proposed. Otherwise start
          # over from the current base; deleting the branch closes its stale PR.
          current=false
          if proposed=$(gh api "repos/$repo/contents/$LOCK?ref=$BRANCH" --jq .sha 2>/dev/null); then
            if [ "$proposed" = "$(git hash-object "$LOCK")" ]; then
              current=true
            else
              gh api -X DELETE "repos/$repo/git/refs/heads/$BRANCH"
            fi
          fi

          pr=
          if [ "$current" = true ]; then
            # Closing the branch's PR (and keeping the branch) rejects this
            # lockfile. A run that stopped after the commit left no PR, so this
            # one opens it.
            head=$(gh api "repos/$repo/git/ref/heads/$BRANCH" --jq .object.sha)
            pr=$(gh api "repos/$repo/commits/$head/pulls" \
              --jq "map(select(.head.ref == \"$BRANCH\" and .head.sha == \"$head\"))[0] // empty")
            if [ -n "$pr" ] && [ "$(printf '%s' "$pr" | jq -r .state)" = closed ]; then
              echo "$BRANCH proposes this lockfile; its PR was closed"
              exit 0
            fi
          else
            gh api -X POST "repos/$repo/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$GITHUB_SHA" >/dev/null

            # createCommitOnBranch produces a signed (verified) commit.
            jq -n \
              --arg query "$COMMIT_QUERY" \
              --arg repository "$repo" \
              --arg branch "$BRANCH" \
              --arg head "$GITHUB_SHA" \
              --arg path "$LOCK" \
              --rawfile lock "$LOCK" \
              '{query: $query, variables: {input: {branch: {repositoryNameWithOwner: $repository, branchName: $branch}, expectedHeadOid: $head, message: {headline: "Update mise tools"}, fileChanges: {additions: [{path: $path, contents: ($lock | @base64)}]}}}}' \
              >"$RUNNER_TEMP/commit.json"
            gh api graphql --input "$RUNNER_TEMP/commit.json" >/dev/null
          fi

          if [ -z "$pr" ]; then
            pr=$(gh api -X POST "repos/$repo/pulls" \
              -f title="Update mise tools" \
              -f head="$BRANCH" \
              -f base="$BASE_BRANCH" \
              -F body=@"$RUNNER_TEMP/body.md")
            echo "opened #$(printf '%s' "$pr" | jq -r .number)"
          fi
          # Each step below is safe to repeat, so a later run finishes what a
          # failed one left. --auto enables auto-merge, or merges at once when
          # the PR already meets the required checks.
          number=$(printf '%s' "$pr" | jq -r .number)
          gh api -X POST "repos/$repo/issues/$number/labels" -f 'labels[]=dependencies' >/dev/null
          if [ "$(printf '%s' "$pr" | jq '.auto_merge == null')" = true ]; then
            gh pr merge -R "$repo" --auto --merge "$number"
          fi
