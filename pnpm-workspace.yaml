packages:
  - "packages/kopje"

# Every pinned version of the workspace's packages, each named `catalog:` in a package.json. `pnpm pack` writes the
# versions into the published manifest (scripts/check-kopje-package.mjs). deploy/package.json is outside the workspace
# and pins its own.
catalog:
  # Runtime libraries. The package has no dependencies: its bundles in dist/ carry them.
  age-encryption: 0.3.1
  aws4fetch: 1.0.20
  blurhash: 2.0.5
  entities: 8.1.0
  es-toolkit: 1.53.1
  hono: 4.13.16
  htmlparser2: 12.0.0
  jose: 6.2.14
  linkify-it: 6.1.0
  sanitize-html: 2.18.1
  temporal-polyfill: 1.0.6
  valibot: 1.5.0

  # Fedify, one version for all of its packages.
  "@fedify/fedify": 2.4.5
  "@fedify/testing": 2.4.5
  "@fedify/vocab": 2.4.5

  # Cloudflare Workers: the bundler and dev server, the runtime types and the workerd test pool. deploy/package.json
  # pins the same wrangler.
  "@cloudflare/vitest-plugin": 1.4.11
  "@cloudflare/workers-types": 5.20261101.1
  wrangler: 4.156.0

  # Tests: the runner, its coverage provider and its vite, property tests, the browser job, image fixtures, the HTML,
  # CSS and source scans, and the Markdown the docs checks read.
  "@axe-core/playwright": 4.14.0
  "@jsquash/webp": 1.5.0
  "@playwright/test": 1.64.1
  "@vitest/coverage-v8": 5.1.0
  css-tree: 3.2.1
  fast-check: 4.10.2
  mdast-util-from-markdown: 2.1.0
  mdast-util-gfm: 3.1.0
  micromark-extension-gfm: 3.0.0
  oxc-parser: 0.156.0
  parse5: 8.0.1
  vite: 7.3.7
  vitest: 5.1.0

  # Lint, format, unused files, dependencies and exports (knip.json), and the Git hooks.
  knip: 6.44.1
  lefthook: 2.2.1
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2005

  # TypeScript and type packages.
  "@types/css-tree": 3.2.0
  "@types/node": 24.19.2
  "@types/sanitize-html": 2.16.2
  typescript: 7.0.2

  # The client bundle's builder (packages/kopje/scripts/build-assets.mjs), at the version wrangler resolves; a new
  # version may change the bundle's bytes, which the build then republishes under a new name.
  esbuild: 0.28.2

# Dependency build scripts, each reviewed: none runs, since every one of these packages takes its platform binary from
# optionalDependencies.
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false

# Fail installs when an unreviewed dependency build script appears.
strictDepBuilds: true

# Reject package versions published within the last 3 days.
minimumReleaseAge: 4320

# Block git/tarball URL sources in transitive dependencies.
blockExoticSubdeps: true

# Detect package trust/provenance downgrades.
trustPolicy: no-downgrade

# @fedify/fedify 2.4.5 pins @opentelemetry/sdk-metrics 2.7.1, which pins @opentelemetry/core 2.7.1
# (GHSA-8988-4f7v-96qf, fixed in 2.8.0); this moves it to the version of its siblings. Drop it once Fedify releases
# with a later sdk-metrics. .github/renovate.json keeps it on 2.x, the line Fedify is built against.
overrides:
  "@opentelemetry/sdk-metrics@2.7.1": 2.12.0
