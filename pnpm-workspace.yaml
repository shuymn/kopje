packages:
  - "packages/kopje"

# Every pinned version of the workspace's packages, each named `catalog:` in a package.json. `pnpm pack` writes the
# versions into the published manifest (scripts/check-kopje-package.mjs). deploy/package.json is outside the workspace
# and pins its own.
catalog:
  # Runtime libraries. The package has no dependencies: its bundles in dist/ carry them.
  age-encryption: 0.3.1
  aws4fetch: 1.0.20
  blurhash: 2.0.5
  entities: 9.0.0
  es-toolkit: 1.53.2
  hono: 4.13.22
  htmlparser2: 12.0.0
  jose: 6.2.18
  linkify-it: 6.1.0
  sanitize-html: 2.18.2
  temporal-polyfill: 1.0.8
  valibot: 1.5.0

  # Fedify, one version for all of its packages, and the structured-field parser it reads Signature-Input with, at the
  # version @fedify/fedify resolves: src/federation/inbound.ts reads the member Fedify verified with the same copy
  # (test-node/fedify-usage.test.ts).
  "@fedify/fedify": 2.4.6
  "@fedify/testing": 2.4.6
  "@fedify/vocab": 2.4.6
  structured-field-values: 2.0.4

  # Cloudflare Workers: the bundler and dev server, the runtime types and the workerd test pool. deploy/package.json
  # pins the same wrangler.
  "@cloudflare/vitest-plugin": 1.8.5
  "@cloudflare/workers-types": 5.20261120.1
  wrangler: 4.165.0
  # The workerd test pool on SQLite 3.53.4 (workerd 1.20261023.1), for the kopje-main-runtime project
  # (vitest.main-runtime.config.ts): main's statements prepare there, so the rewritten policy statements are compared
  # with them. .github/renovate.json holds it.
  vitest-plugin-sqlite-3534: npm:@cloudflare/vitest-plugin@1.4.11

  # Tests: the runner, its coverage provider and its vite, property tests, the browser job, image fixtures, the HTML,
  # CSS and source scans, the Markdown the docs checks read, and the canonicalization Mastodon's signature fixtures hash
  # (jsonld: the copy @fedify/fedify resolves).
  "@axe-core/playwright": 4.14.1
  "@jsquash/webp": 1.5.0
  "@playwright/test": 1.65.1
  "@vitest/coverage-v8": 5.1.2
  css-tree: 3.2.1
  fast-check: 4.11.0
  jsonld: 9.0.0
  mdast-util-from-markdown: 2.1.0
  mdast-util-gfm: 3.1.0
  micromark-extension-gfm: 3.0.0
  oxc-parser: 0.159.0
  parse5: 8.1.1
  vite: 8.3.8
  vitest: 5.1.2
  # The model checker Kopje's TLA+ specifications run under in the Node suite (packages/kopje/spec/,
  # test-node/collection-consent-spec/); packages/kopje/scripts/tlc-check.mjs checks the same with the official TLC.
  tla-ts: 0.0.10

  # Lint, format, unused files, dependencies and exports (knip.json), and the Git hooks.
  knip: 6.48.0
  lefthook: 2.2.3
  oxfmt: 0.79.0
  oxlint: 1.94.0
  oxlint-tsgolint: 7.0.2008

  # TypeScript and type packages.
  "@types/css-tree": 3.2.0
  "@types/node": 26.6.10
  "@types/sanitize-html": 2.16.2
  typescript: 7.0.2

  # The client bundle's builder (packages/kopje/scripts/build-assets.mjs), at the version wrangler resolves; a new
  # version may change the bundle's bytes, which the build then republishes under a new name.
  esbuild: 0.28.2

# Dependency build scripts, each reviewed: none runs, since every one of these packages takes its platform binary from
# optionalDependencies.
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false

# Fail installs when an unreviewed dependency build script appears.
strictDepBuilds: true

# Reject package versions published within the last 3 days.
minimumReleaseAge: 4320

# Block git/tarball URL sources in transitive dependencies.
blockExoticSubdeps: true

# Detect package trust/provenance downgrades.
trustPolicy: no-downgrade

# @fedify/fedify 2.4.5 pins @opentelemetry/sdk-metrics 2.7.1, which pins @opentelemetry/core 2.7.1
# (GHSA-8988-4f7v-96qf, fixed in 2.8.0); this moves it to the version of its siblings. Drop it once Fedify releases
# with a later sdk-metrics. .github/renovate.json keeps it on 2.x, the line Fedify is built against.
overrides:
  "@opentelemetry/sdk-metrics@2.7.1": 2.12.1
