  Variant = "base"
SPECIFICATION LSpec
CHECK_DEADLOCK FALSE
PROPERTY SlotsReleased
PROPERTY RecordsCleared
PROPERTY InputsDeleted
PROPERTY ContainersStopped
PROPERTY CompletedSwept
PROPERTY PendingStarts
